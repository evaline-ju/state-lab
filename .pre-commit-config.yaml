# Pre-commit hooks for state-lab.
#
# Deliberately minimal: this is a demos repo, not a product. The single hook is secret
# detection — demo configs juggle kubeconfigs and agent settings, and gitleaks runs
# locally with defaults (the CI action would require a license for org repos).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
